    rp_deg: 0.0
    src_voxel: 0.05
    min_z_filter: 0.05
    robot_radius: 0.45
    accum_window_s: 0.10
    imu_topic: "/livox/imu"
  national_n21_gs:
    dataset_in: "national_clean"
    dataset_full: "national_full"
    manifest: "benchmarks/manifests/n21_scenarios.yaml"
    map_pcd: "~/external_datasets/nhk2026_cad_nofloor.pcd"
