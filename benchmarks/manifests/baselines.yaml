global_search_suites:
  unity_nhk_gs:
    dataset: "unity_nhk_dynamic_clean"
    manifest: "benchmarks/manifests/unity_gt_scenarios.yaml"
    map_pcd: "~/external_datasets/unity_nhk_scanned_map.pcd"
    min_res: 0.15
    max_level: 4
    score_thresh_pct: 0.30
    timeout_ms: 2000
    rp_deg: 0.0
    src_voxel: 0.05
    min_z_filter: 0.05
    robot_radius: 0.45
    accum_window_s: 0.0
  unity_nhk_gs_accum:
    dataset: "unity_nhk_dynamic_clean"
    manifest: "benchmarks/manifests/unity_gt_scenarios.yaml"
