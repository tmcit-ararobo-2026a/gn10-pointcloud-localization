          score_threshold: 25.0
          voxel_leaf_size: 0.15
          scan_min_range: 0.40
          scan_max_range: 18.0
          use_odom: false
          use_imu_preintegration: false
          use_continuous_time_deskew: false
          enable_map_odom_tf: true
      - label: "dll"
        type: "dll"
        map_file: "~/external_datasets/hdl_501_map.bt"
        shift_xyz: [-12.16, -18.0, 0.08]
        params:
          use_imu: false
          align_method: 1
          update_rate: 20.0
          update_min_time: 0.04
          update_min_d: 0.01
          update_min_a: 0.01
          solver_max_iter: 75
          solver_max_threads: 4
      - label: "kiss_icp"
        type: "kiss_icp"
        min_range: 0.40
        max_range: 18.0
        voxel_size: 0.30

