/**:
  ros__parameters:
    map_source_type: "json" # "json" または "ros2_param"
    map_file_path: ""       # 空文字列の場合はパッケージ相対パス等を使用
    
    # map_source_type が "ros2_param" の場合に使用
    # map_objects: ["BOX,0.0,5.7,0.0,0.15,5.25,0.05", "CYLINDER,0.55,0.87,0.0,0.255,0.1365,0.0"]

    frames:
      map_frame: "map"
      base_frame: "base_link"

    topics:
      input_cloud: "/livox/lidar"
      input_imu: "/livox/imu"
      output_ground: "/ground_cloud"
      output_obstacle: "/obstacle_cloud"
      output_pose: "/platform_constraint"
      output_markers: "/field_map_markers"

    filter_params:
      max_range: 12.0
      robot_radius: 0.6
      robot_height_min: 0.0
      robot_height_max: 1.2
      ground_z_thresh: 0.08
      max_points: 200000

    matching_params:
      search_range_xy: 0.30
      search_step_xy: 0.03
      search_range_yaw: 0.15
      search_step_yaw: 0.02
      max_dist_thresh: 0.20
      cost_threshold: 0.20

    initial_pose:
      x: -4.0
      y: -4.0
      yaw: -1.5708