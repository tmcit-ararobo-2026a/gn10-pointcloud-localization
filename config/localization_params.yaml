/**:
  ros__parameters:
    # ----------------------------------------------------------------------------------
    # マップ読み込み設定
    # ----------------------------------------------------------------------------------
    # map_source_type:
    #   - "json"       : config/nhk2026_map.json 等の直方体・円柱幾何定義 (起動時に自動で3D ESDFテクスチャ化)
    #   - "pcd"        : Point Cloud Data (.pcd) ファイル。自動でキャッシュ (.esdf) を作成/読込
    #   - "esdf"       : 事前生成されたバイナリ距離場 (.esdf) を直接 GPU 3D テクスチャにロード
    #   - "ros2_param" : map_objects パラメータ配列から直接読み込み
    map_source_type: "json"

    # map_file_path:
    #   マップファイルのパス。
    #   - 絶対パス ("/home/...") の場合は指定先を直接参照
    #   - 相対パス ("map.pcd", "test.esdf" など) の場合はパッケージ内の map/ ディレクトリから自動探索
    #   - 空文字列かつ json の場合はデフォルトの nhk2026_map.json を参照
    map_file_path: ""

    # 3D ESDF (Euclidean Signed/Unsigned Distance Field) 設定
    esdf:
      resolution: 0.05      # [m] 3D グリッドのセル解像度。小さくするほど微細な壁形状を再現可能 (0.03〜0.05m 推奨)
      max_dist: 0.50        # [m] 距離場の上限クリッピング距離。GPU テクスチャ内の最大距離 (メモリ削減としきい値外打ち切り)
      publish_map: false    # マップ読み込み完了後に ESDF を可視化用点群としてパブリッシュするか
      publish_max_distance: -1.0 # [m] 可視化する最大距離 (-1.0 の場合は max_dist 未満の全ボクセル)
      publish_stride: 1     # 可視化時のボクセル間引きステップ (1: 全ボクセル, 2: 1/8 に間引き)
    
    # map_source_type が "ros2_param" の場合に使用
    # map_objects: ["BOX,0.0,5.7,0.0,0.15,5.25,0.05", "CYLINDER,0.55,0.87,0.0,0.255,0.1365,0.0"]

    # ----------------------------------------------------------------------------------
    # TF フレーム設定
    # ----------------------------------------------------------------------------------
    frames:
      map_frame: "map"         # 固定マップ座標系
      base_frame: "base_link"  # ロボット基準座標系

    # ----------------------------------------------------------------------------------
    # トピック設定
    # ----------------------------------------------------------------------------------
    topics:
      input_cloud: "/livox/lidar"             # 3D LiDAR (PointCloud2) 入力トピック
      input_imu: "/livox/imu"                 # IMU 入力トピック (角速度積分による予測更新)
      output_dynamic: "/dynamic_cloud"        # 静的マップから外れた動的障害物点群
      output_ground: "/ground_cloud"          # 地面フィルタで除去された床面点群
      output_obstacle: "/obstacle_cloud"      # 障害物としてマッチングに使用された点群
      output_pose: "/platform_constraint"     # 推定自己位置 (PoseWithCovarianceStamped)
      output_markers: "/field_map_markers"    # RViz 可視化用フィールドマーカー
      output_esdf_map: "/esdf_map"            # 3D ESDF マップ可視化用点群 (PointCloud2)

    # ----------------------------------------------------------------------------------
    # 点群前処理 (GroundFilter) パラメータ
    # ----------------------------------------------------------------------------------
    filter_params:
      max_range: 12.0          # [m] 処理対象とする LiDAR 点群の最大距離 (遠方のノイズ除去)
      robot_radius: 0.8        # [m] ロボット自身（車体フレーム・アーム等）を除外する自己半径
      robot_height_min: 0.0    # [m] base_link から見た障害物点群の有効下限高さ
      robot_height_max: 1.2    # [m] base_link から見た障害物点群の有効上限高さ (天井や高架構造を除去)
      ground_z_thresh: 0.04    # [m] 床面判定の許容しきい値。これ以下の高さの点をグラウンドとして除去
      max_points: 200000       # GPU 上で確保する最大点群バッファ数

    # 非反復スキャンの観測形状を安定させ、各点をスキャン末尾時刻へ運動補正
    scan_accumulation:
      window_s: 0.10
      timestamp_field: "timestamp"
      timestamp_scale: 1.0e-9  # Livox PointCloud2: 絶対ナノ秒 -> 秒
      timestamp_relative: false

    # ----------------------------------------------------------------------------------
    # スキャンマッチング (3D ESDF テクスチャ参照) パラメータ
    # ----------------------------------------------------------------------------------
    matching_params:
      use_map_bounds: true    # PCD/ESDFの評価範囲を地図ヘッダーから取得
      search_range_xy: 0.30    # [m] ローカル追従時の XY 探索範囲 (±0.30m)
      search_step_xy: 0.05     # [m] ローカル追従時の XY 探索刻み幅 (グリッド解像度と同等推奨)
      search_range_yaw: 0.6    # [rad] ローカル追従時の Yaw 探索範囲 (約 ±34度)
      search_step_yaw: 0.05    # [rad] ローカル追従時の Yaw 探索刻み幅 (約 2.8度)
      fine_refine: true        # 最良解の周りで5x5x5候補の局所探索を反復
      fine_refine_levels: 2    # XY=0.05mなら最終刻み2mm、Yaw=0.05radなら0.002rad
      max_dist_thresh: 0.25    # [m] コスト計算時に加算する距離残差の打ち切り上限。これ以上の離れはペナルティ定数
      cost_threshold: 0.165    # [m] 平均残差コストがこの値を超えるとマッチング失敗判定 (Lost カウント加算)
      inlier_dist_thresh: 0.08 # [m] マップ表面までの距離がこの値以下の点を合致 (Inlier) と判定
      min_inliers: 60          # 動的障害物があっても位置推定成功とみなす最小 Inlier 点数
      inlier_cost_thresh: 0.05 # [m] Inlier 点のみを対象とした平均残差しきい値 (形状の一致度判定)

    # ----------------------------------------------------------------------------------
    # 2D LiDAR (Lakibeam 1 等) 統合設定
    # ----------------------------------------------------------------------------------
    lidar_2d:
      enable: false              # 後方 2D LiDAR の点群を 3D 障害物バッファにマージするかどうか
      topic: "/lakibeam/scan"    # 2D LiDAR の LaserScan トピック名
      frame_id: "lakibeam_frame" # 2D LiDAR の TF フレーム名

    # ----------------------------------------------------------------------------------
    # 初期位置設定
    # ----------------------------------------------------------------------------------
    initial_pose:
      use_for_local_search: false # true: 起動直後から初期位置を中心にローカル追従 / false: 即座にグローバルサーチを実施
      x: 0.0                      # 初期位置 X [m]
      y: 0.0                      # 初期位置 Y [m]
      yaw: 0.0                    # 初期位置 Yaw [rad]
    
    # ----------------------------------------------------------------------------------
    # グローバルサーチ (ロスト復帰・初期位置自動推定) パラメータ
    # ----------------------------------------------------------------------------------
    global_search:
      range_min_x: -5.25        # [m] マップ全域探索の X 最小値
      range_max_x:  5.25        # [m] マップ全域探索の X 最大値
      range_min_y: -5.70        # [m] マップ全域探索の Y 最小値
      range_max_y:  5.70        # [m] マップ全域探索の Y 最大値
      range_yaw_diff: 3.1415    # [rad] Yaw 角探索幅 (IMU の Yaw 角を中心に ±range_yaw_diff を探索)
      step_xy: 0.30             # [m] グローバルサーチの XY 検索ピッチ
      step_yaw: 0.3             # [rad] グローバルサーチの Yaw 検索ピッチ (約 17度)
      downsample_stride: 2      # グローバル探索時の点群間引き率 (2: 1/2 の点数で高速全域スキャン)
      lost_count_thresh: 10     # 何フレーム連続でコスト超過/インライア不足が続いたらロストと判定してグローバルサーチへ移行するか
