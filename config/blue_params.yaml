/**:
  ros__parameters:
    map_source_type: "json" # "json" または "ros2_param"
    map_file_path: ""       # 空文字列の場合はパッケージ相対パス等を使用
    
    # map_source_type が "ros2_param" の場合に使用
    # map_objects: ["BOX,0.0,5.7,0.0,0.15,5.25,0.05", "CYLINDER,0.55,0.87,0.0,0.255,0.1365,0.0"]

    frames:
      map_frame: "map"
      base_frame: "base_link"

    topics:
      input_cloud: "/livox/lidar"
      input_imu: "/livox/imu"
      output_dynamic: "/dynamic_cloud"
      output_ground: "/ground_cloud"
      output_obstacle: "/obstacle_cloud"
      output_pose: "/platform_constraint"
      output_markers: "/field_map_markers"

    filter_params:
      max_range: 12.0
      robot_radius: 0.8
      robot_height_min: 0.0
      robot_height_max: 1.2
      ground_z_thresh: 0.04
      max_points: 200000

    matching_params:
      search_range_xy: 0.30
      search_step_xy: 0.05
      search_range_yaw: 0.6
      search_step_yaw: 0.05
      fine_refine: true # 125 local candidates around the coarse best pose
      max_dist_thresh: 0.2
      cost_threshold: 0.165  # all-point mean clipped unsigned surface distance [m]
      inlier_dist_thresh: 0.08 # [m] 距離がこの値以下の点をマップ合致(Inlier)とみなす
      min_inliers: 60          # 動的障害物があってもマッチング成立とする最小Inlier点数
      inlier_cost_thresh: 0.05 # [m] Inlier点の平均残差しきい値

    lidar_2d:
      enable: false             # 後方2D LiDAR (Lakibeam 1) の点群マージを有効化
      topic: "/lakibeam/scan"   # 2D LiDAR の LaserScan トピック名
      frame_id: "lakibeam_frame" # 2D LiDAR のフレームID

    initial_pose:
      use_for_local_search: false
      x: -4.57
      y: 1.9
      yaw: -1.57
    
    global_search:
      range_min_x: -5.25        # 探索範囲 X 最小値 [m]
      range_max_x:  5.25        # 探索範囲 X 最大値 [m]
      range_min_y: -5.70        # 探索範囲 Y 最小値 [m]
      range_max_y:  5.70        # 探索範囲 Y 最大値 [m]
      range_yaw_diff: 1.0   # 探索範囲 Yaw 差分最大値 [rad]
      step_xy: 0.30            # グローバルサーチのXY検索ピッチ [m]
      step_yaw: 0.3            # グローバルサーチのYaw検索ピッチ [rad]
      downsample_stride: 2     # グローバル探索時の点群抽出ピッチ (2: 50%間引き, 1: 完全RAW)
      lost_count_thresh: 5     # ロスト確定までの連続判定フレーム数
