/**:
  ros__parameters:
    # Shared map and ESDF settings
    map_source_type: "json"
    map_file_path: ""
    esdf:
      resolution: 0.05
      max_dist: 0.50
      crop_enabled: true
      crop_min_x: -5.5
      crop_max_x: 5.5
      crop_min_y: -6.0
      crop_max_y: 6.0
      min_z: -0.20
      max_z: 4.00
      publish_map: true
      publish_max_distance: -1.0
      publish_stride: 1

    frames:
      map_frame: "map"
      base_frame: "base_link"

    topics:
      input_cloud: "/livox/lidar"
      input_imu: "/livox/imu"
      output_dynamic: "/dynamic_cloud"
      output_ground: "/ground_cloud"
      output_obstacle: "/obstacle_cloud"
      output_localization_success: "/robot/operation/localization_success"
      output_pose: "/platform_constraint"
      output_markers: "/field_map_markers"
      output_esdf_map: "/esdf_map"
      fused_prior: "/platform_constraint"

    publish_tf: true
    fusion:
      use_prior: false
      prior_max_age_s: 0.25

    filter_params:
      max_range: 12.0
      robot_radius: 0.8
      robot_height_min: 0.0
      robot_height_max: 1.2
      ground_z_thresh: 0.04
      max_points: 200000

    scan_accumulation:
      window_s: 0.10
      timestamp_field: "timestamp"
      timestamp_scale: 1.0e-9
      timestamp_relative: false

    matching_params:
      search_range_xy: 0.30
      search_step_xy: 0.05
      search_range_yaw: 0.6
      search_step_yaw: 0.05
      fine_refine: true
      fine_refine_levels: 2
      max_dist_thresh: 0.25
      cost_threshold: 0.165
      dynamic_dist_thresh: 0.15
      field_min_x: -5.5
      field_max_x: 5.5
      field_min_y: -6.0
      field_max_y: 6.0
      use_map_bounds: true
      inlier_dist_thresh: 0.08
      min_inliers: 60
      inlier_cost_thresh: 0.05
      weight_2d_lidar: 0.50
      min_2d_points: 30
      target_2d_points: 200
      min_3d_points: 50
      dynamic_yaw_expansion: true
      dynamic_yaw_omega_thresh: 0.5
      dynamic_yaw_factor: 0.15
      dynamic_yaw_max_range: 0.35

    velocity_estimation:
      enable: true
      window_sec: 0.20
      min_dt_sec: 0.15
      max_dt_sec: 0.50
      max_linear_velocity: 4.0

    lidar_2d:
      enable: true
      deskew: true
      topic: "/lakibeam/scan"
      frame_id: "lakibeam_frame"
      tf_wait_sec: 0.05

    realsense:
      enable: true                          # RealSense 動的背景除去フィルタの有効化 (実機デフォルト: true)
      input_topic: "/realsense/cropped_cloud" # トラッカーからのROIクロップ点群
      output_topic: "/realsense/dynamic_cloud" # 静的マップ差分後の動的点群
      status_topic: "/realsense/filter_status" # フィルター状態通知 (READY, WAITING_FOR_TF等)
      prediction_topic: "/cloth/filter_prediction" # トラッカーからの予測位置マーカー
      prediction_tolerance_sec: 0.05        # 予測マーカーと点群の時刻照合許容差 [s]
      dynamic_dist_thresh: 0.08             # 動的判定距離閾値 [m] (ESDFボクセル解像度0.05mに対して安定な値)
      ground_z_thresh: -1.0                 # 床面高さ除外閾値 [m] (<0でfilter_params.ground_z_threshを継承)
      height_max: 3.0                       # 高さ上限除外閾値 [m]
      tf_wait_sec: 0.15                     # TF 待機タイムアウト [s]
      max_age_sec: 0.25                     # 点群許容遅延 [s]
      pose_max_age_sec: 0.25                # 姿勢許容遅延 [s]
      poll_sec: 0.02                        # 独立タイマー周期 [s] (50Hz: CPU負荷とLiDARジッター低減)
      queue_size: 8                         # キュー最大保持フレーム数
      min_points: 1                         # 最小入力点数
      min_dynamic_points: 5                 # 抽出後の最小動的点数 (照明等の散乱ノイズカット)
      tracking_protection: true             # 予測マーカー近傍保護の有効化

    global_search:
      range_min_x: -5.25
      range_max_x: 5.25
      range_min_y: -5.70
      range_max_y: 5.70
      range_yaw_diff: 3.1415
      step_xy: 0.30
      step_yaw: 0.3
      downsample_stride: 2
      lost_count_thresh: 10

    initial_pose:
      use_for_local_search: false
      x: 0.0
      y: 0.0
      yaw: 0.0

    benchmark:
      enable: false
      csv_output_path: ""
